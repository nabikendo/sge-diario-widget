name: Build SGE Widget APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sge-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sge-diario-widget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar no Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SGE-Diario-Widget.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SGE-Diario-Widget.apk --target "$GITHUB_SHA" \
            --title "SGE Diário Widget (última versão)" \
            --notes "APK de teste gerado automaticamente. Baixe SGE-Diario-Widget.apk abaixo, em Assets."
