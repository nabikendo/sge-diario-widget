name: Build SGE Widget APK

on:
  push:
    branches: [ main, master, feat/ios-inspired-neutral-ui ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sge-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug -Pversao=1.3-preview.${{ github.run_number }} -Pcodigo=${{ github.run_number }} --no-daemon --stacktrace
      - name: Identificar APK de prévia
        run: cp app/build/outputs/apk/debug/app-debug.apk "SGE-Diario-previa-${{ github.run_number }}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sge-diario-widget-apk
          path: SGE-Diario-previa-${{ github.run_number }}.apk
      - name: Publicar no Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SGE-Diario-teste.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SGE-Diario-teste.apk --prerelease --target "$GITHUB_SHA" \
            --title "Canal de testes (última versão)" \
            --notes "APK de teste gerado automaticamente. Baixe SGE-Diario-teste.apk abaixo, em Assets. Para uso diário, prefira a versão estável (tag vX.Y)."

  ui-previews:
    if: github.ref == 'refs/heads/feat/ios-inspired-neutral-ui'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Navegação e capturas em Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/verify-ui.sh -Pversao=1.3-preview.${{ github.run_number }} -Pcodigo=${{ github.run_number }}
      - name: Capturas da prévia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sge-layout-preview-${{ github.run_number }}
          path: |
            ui-previews/*.png
            app/build/reports/androidTests/connected/debug/**
