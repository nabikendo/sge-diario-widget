name: Build SGE Widget APK

on:
  push:
    branches: [ main, master, feat/ios-inspired-neutral-ui, feat/tablet-history-coordination, feat/inapp-updates-school-tools ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sge-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug -Pversao=1.8-preview.${{ github.run_number }} -Pcodigo=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Resumo dos erros
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Could not |FAILED|Caused by|Unresolved|> ' build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > erros.txt
          echo "::error title=Erros do build::$(cat erros.txt)"
      - name: Identificar APK de prévia
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "SGE-Diario-previa-${{ github.run_number }}.apk"
          python scripts/metadata-atualizacao.py "SGE-Diario-previa-${{ github.run_number }}.apk" atualizacao-preview.json
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sge-diario-widget-apk
          path: SGE-Diario-previa-${{ github.run_number }}.apk
      - name: Publicar no Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SGE-Diario-teste.apk
          python scripts/metadata-atualizacao.py SGE-Diario-teste.apk atualizacao-teste.json
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SGE-Diario-teste.apk atualizacao-teste.json --prerelease --target "$GITHUB_SHA" \
            --title "Canal de testes (última versão)" \
            --notes "APK de teste gerado automaticamente. Baixe SGE-Diario-teste.apk abaixo, em Assets. Para uso diário, prefira a versão estável (tag vX.Y)."

  ui-previews:
    if: startsWith(github.ref, 'refs/heads/feat/')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - perfil: pixel_2
            api: 29
          - perfil: pixel_c
            api: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Navegação e capturas em Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: ${{ matrix.perfil }}
          disable-animations: true
          script: bash scripts/verify-ui.sh -Pversao=1.8-preview.${{ github.run_number }} -Pcodigo=${{ github.run_number }}
      - name: Capturas da prévia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sge-layout-preview-${{ github.run_number }}-${{ matrix.perfil }}
          path: |
            ui-previews/*.png
            pdf-previews/*.pdf
            app/build/reports/androidTests/connected/debug/**
