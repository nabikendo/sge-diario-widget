name: Release estável

on:
  push:
    branches: [ main ]
    paths: [ 'release/versao.txt' ]
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (ex.: 1.3)'
        required: true

permissions:
  contents: write

concurrency:
  group: sge-release-estavel
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Definir versão
        id: versao
        env:
          SGE_VERSAO_MANUAL: ${{ inputs.versao }}
        run: |
          SGE_VERSAO="${SGE_VERSAO_MANUAL:-$(cat release/versao.txt)}"
          [[ "$SGE_VERSAO" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Versão inválida.'; exit 1; }
          echo "numero=$SGE_VERSAO" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Testes e APK assinado
        env:
          SGE_VERSAO: ${{ steps.versao.outputs.numero }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease "-Pversao=$SGE_VERSAO" -Pcodigo=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Resumo dos erros
        if: failure()
        run: |
          (grep -E '^e: |^e: file|error:' build.log | head -25; grep -A14 'What went wrong' build.log | head -30) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > erros.txt
          echo "::error title=Erros do build::$(cat erros.txt)"
      - name: Publicar versão estável
        env:
          SGE_VERSAO: ${{ steps.versao.outputs.numero }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "SGE-Diario-$SGE_VERSAO.apk"
          python scripts/metadata-atualizacao.py "SGE-Diario-$SGE_VERSAO.apk" atualizacao.json
          gh release create "v$SGE_VERSAO" "SGE-Diario-$SGE_VERSAO.apk" atualizacao.json --latest --target "$GITHUB_SHA" \
            --title "SGE Diário $SGE_VERSAO" \
            --notes-file release/NOTAS.md
