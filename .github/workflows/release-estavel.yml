name: Release estável

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (ex.: 1.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Testes e APK assinado
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease -Pversao=${{ inputs.versao }} -Pcodigo=${{ github.run_number }} --no-daemon --stacktrace
      - name: Publicar versão estável
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "SGE-Diario-${{ inputs.versao }}.apk"
          gh release create "v${{ inputs.versao }}" "SGE-Diario-${{ inputs.versao }}.apk" --latest --target "$GITHUB_SHA" \
            --title "SGE Diário ${{ inputs.versao }}" \
            --notes "Versão estável, assinada com chave própria. Atualizações futuras serão instaladas por cima."
