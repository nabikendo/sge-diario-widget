name: Build Windows Desktop
on:
  push:
    paths: [ 'desktop-next/**', 'release/versao.txt', '.github/workflows/build-desktop.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        working-directory: desktop-next
        run: |
          $versao = (Get-Content ../release/versao.txt -Raw).Trim()
          npm version "$versao" --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
      - name: Testar leitura do SGE
        working-directory: desktop-next
        run: npm test
      - name: Configuração do Google (backup no Drive)
        working-directory: desktop-next
        shell: pwsh
        run: |
          '{"segredo":"' + $env:GOOGLE_CLIENT_SECRET + '"}' | Set-Content -NoNewline electron/google.segredo.json
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - name: Gerar executável portátil
        working-directory: desktop-next
        run: npm run build:win
        env:
          # Assinatura digital: cadastre os segredos WIN_CSC_LINK (.pfx em base64) e WIN_CSC_KEY_PASSWORD. Sem eles, o instalador sai sem assinatura.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: sge-diario-desktop-windows
          path: desktop-next/release-dist/SGE-Diario-Desktop-Setup-*.exe
